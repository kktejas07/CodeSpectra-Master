name: CI Pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: npx next lint --no-cache
        env:
          SESSION_SECRET: ci-secret
      - run: npx tsc --noEmit --pretty
        env:
          SESSION_SECRET: ci-secret

  test:
    name: Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: npx vitest run --reporter=verbose
        env:
          SESSION_SECRET: ci-secret

  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      MONGO_URL: mongodb://localhost:27017
      MONGODB_URI: mongodb://localhost:27017
      MONGODB_DB_NAME: codespectra_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest backend/tests -q
        timeout-minutes: 10

  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: npx next build
        env:
          SESSION_SECRET: ci-secret
        # Known issue: _global-error prerender fails on clean builds (Next.js 16 bug)
        # If build fails, check output for _global-error before blaming code changes.

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: npx audit-ci --moderate

  docs-sync:
    name: Documentation Drift Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check doc headers
        run: |
          MISSING=$(find docs -name "*.md" -exec grep -L "Auto-Generated\|Public Documentation\|Customer Documentation" {} \; | wc -l)
          echo "Docs missing headers: $MISSING"
          if [ "$MISSING" -gt "0" ]; then
            echo "⚠️  Some documentation files are missing auto-generated headers."
            find docs -name "*.md" -exec grep -L "Auto-Generated\|Public Documentation\|Customer Documentation" {} \;
          fi
