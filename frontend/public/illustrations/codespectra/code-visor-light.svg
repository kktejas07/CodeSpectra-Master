<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" fill="none" role="img"><title>CodeSpectra visor mascot with a code screen</title><defs><linearGradient id="mint" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#5b84ff"/></linearGradient><linearGradient id="visor" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a6cf0"/><stop offset=".6" stop-color="#2f5be7"/><stop offset="1" stop-color="#1e3a8a"/></linearGradient></defs><style>
  .surf{fill:#f8fafc;stroke:#64748b;stroke-opacity:.7}
  .ln{stroke:#64748b;stroke-opacity:.6;fill:none}
  .txt{fill:#64748b;opacity:.75}
  @media (prefers-reduced-motion: reduce){
    *{animation:none!important}
    .tag,.num,.row,.ev,.pass,.f{opacity:1!important}
    .ck,.ok{stroke-dashoffset:0!important}
    .gauge{stroke-dashoffset:36!important}
    .pkt{offset-distance:50%}
  }

  .float{animation:float 5s ease-in-out infinite}
  @keyframes float{50%{transform:translateY(-6px)}}
  .knob{animation:knob 2.4s ease-in-out infinite}
  @keyframes knob{50%{fill:#93b4ff}}
  .scan{animation:scan 3s ease-in-out infinite alternate}
  @keyframes scan{to{transform:translateY(84px)}}
  .bl{animation:bl 3.2s ease-in-out infinite}.br{animation:br 3.2s ease-in-out infinite}
  @keyframes bl{50%{transform:translateX(-4px)}}@keyframes br{50%{transform:translateX(4px)}}
  .sl{animation:sl 3.2s ease-in-out infinite}
  @keyframes sl{0%,100%{opacity:1}50%{opacity:.7}}
</style><g class="float" style="transform-origin:120px 120px"><rect x="116.0" y="18.0" width="8.0" height="36.0" rx="4.0" fill="#c9d5f5"/><circle class="knob" cx="120" cy="16.0" r="8.0" fill="#2f5be7"/><ellipse cx="120" cy="56.0" rx="26.0" ry="10.0" fill="#c9d5f5"/><rect x="14.0" y="90.0" width="28.0" height="60.0" rx="12.0" fill="#c9d5f5"/><rect x="198.0" y="90.0" width="28.0" height="60.0" rx="12.0" fill="#c9d5f5"/><rect x="28.0" y="62.0" width="184.0" height="116.0" rx="34.0" fill="#c9d5f5"/><rect x="40.0" y="74.0" width="160.0" height="92.0" rx="24.0" fill="url(#visor)"/><path d="M52.0 122.0 C54.0 96.0 76.0 82.0 114.0 82.0" stroke="#fff" stroke-opacity=".18" stroke-width="10.0" stroke-linecap="round"/><clipPath id="scr"><rect x="40.0" y="74.0" width="160.0" height="92.0" rx="24.0"/></clipPath><g clip-path="url(#scr)"><rect class="scan" x="28.0" y="76.0" width="184.0" height="3.0" fill="#fff" opacity=".35"/></g><g stroke="#fff" stroke-width="9.0" stroke-linecap="round" stroke-linejoin="round" fill="none"><path class="bl" d="M94.0 100.0 L74.0 120 L94.0 140.0"/><path class="br" d="M146.0 100.0 L166.0 120 L146.0 140.0"/><path class="sl" d="M128.0 94.0 L112.0 146.0"/></g></g></svg>