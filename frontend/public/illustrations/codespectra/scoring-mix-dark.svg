<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 184" fill="none" role="img"><title>Example question mix: a fresher gets mostly easy questions, a senior mostly hard</title><defs><linearGradient id="mint" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#14b8a6"/><stop offset="1" stop-color="#3ecf8e"/></linearGradient><linearGradient id="spec" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset=".5" stop-color="#00c573"/><stop offset="1" stop-color="#38bdf8"/></linearGradient></defs><style>
  .surf{fill:#0d131f;stroke:#94a3b8;stroke-opacity:.7}
  .ln{stroke:#94a3b8;stroke-opacity:.6;fill:none}
  .txt{fill:#94a3b8;opacity:.75}
  @media (prefers-reduced-motion: reduce){
    *{animation:none!important}
    .tag,.num,.row,.ev,.pass,.f{opacity:1!important}
    .ck,.ok{stroke-dashoffset:0!important}
