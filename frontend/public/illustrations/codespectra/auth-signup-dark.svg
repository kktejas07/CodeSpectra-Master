<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 210" fill="none" role="img"><title>Profile, practice and a certificate building up</title><defs><linearGradient id="mint" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#14b8a6"/><stop offset="1" stop-color="#3ecf8e"/></linearGradient><linearGradient id="spec" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset=".5" stop-color="#00c573"/><stop offset="1" stop-color="#38bdf8"/></linearGradient></defs><style>
  .surf{fill:#0d131f;stroke:#94a3b8;stroke-opacity:.7}
  .ln{stroke:#94a3b8;stroke-opacity:.6;fill:none}
  .txt{fill:#94a3b8;opacity:.75}
  @media (prefers-reduced-motion: reduce){
    *{animation:none!important}
    .tag,.num,.row,.ev,.pass,.f{opacity:1!important}
    .ck,.ok{stroke-dashoffset:0!important}
    .gauge{stroke-dashoffset:36!important}
    .pkt{offset-distance:50%}
  }

  .row{opacity:0;animation:in 6s ease infinite}
  .r2{animation-delay:.5s}.r3{animation-delay:1s}.r4{animation-delay:1.5s}
  @keyframes in{0%,5%{opacity:0;transform:translateX(-8px)}20%,90%{opacity:1;transform:none}100%{opacity:0}}
  .badge{transform-origin:270px 70px;animation:pop 6s cubic-bezier(.3,1.6,.5,1) infinite}
  @keyframes pop{0%,45%{transform:scale(0)}60%,90%{transform:scale(1)}100%{transform:scale(0)}}
  .shine{animation:sh 3s linear infinite}@keyframes sh{from{transform:translateX(-60px)}to{transform:translateX(90px)}}
</style><rect x="14" y="14" width="200" height="182" rx="10" class="surf" stroke-width="1.5"/><circle cx="42" cy="38" r="12" fill="#475569" fill-opacity=".3"/><rect x="62" y="30" width="80" height="6" rx="3" fill="#475569" opacity=".6"/><rect x="62" y="41" width="52" height="5" rx="2.5" fill="#475569" opacity=".35"/><g class="row r1"><circle cx="40" cy="70" r="7" fill="url(#mint)"/><path d="M36.5 70l2.5 2.5 4.5-5" stroke="#020617" stroke-width="1.8" fill="none" stroke-linecap="round"/><text x="56" y="74" font-family="ui-sans-serif,system-ui" font-size="11" fill="#94a3b8">Profile</text></g><g class="row r2"><circle cx="40" cy="98" r="7" fill="url(#mint)"/><path d="M36.5 98l2.5 2.5 4.5-5" stroke="#020617" stroke-width="1.8" fill="none" stroke-linecap="round"/><text x="56" y="102" font-family="ui-sans-serif,system-ui" font-size="11" fill="#94a3b8">Practice: 24 problems</text></g><g class="row r3"><circle cx="40" cy="126" r="7" fill="url(#mint)"/><path d="M36.5 126l2.5 2.5 4.5-5" stroke="#020617" stroke-width="1.8" fill="none" stroke-linecap="round"/><text x="56" y="130" font-family="ui-sans-serif,system-ui" font-size="11" fill="#94a3b8">Mock test: 82%</text></g><g class="row r4"><circle cx="40" cy="154" r="7" fill="url(#mint)"/><path d="M36.5 154l2.5 2.5 4.5-5" stroke="#020617" stroke-width="1.8" fill="none" stroke-linecap="round"/><text x="56" y="158" font-family="ui-sans-serif,system-ui" font-size="11" fill="#94a3b8">Assessment invite</text></g><g class="badge"><path d="M270 32 l10 7 12-1 4 11 10 7-4 11 4 11-10 7-4 11-12-1-10 7-10-7-12 1-4-11-10-7 4-11-4-11 10-7 4-11 12 1z" fill="url(#spec)"/><circle cx="270" cy="70" r="20" fill="#020617" fill-opacity=".25"/><path d="M261 70l6 6 12-12" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M258 104 l-8 26 12-6 6 12 6-30z M282 104 l8 26-12-6-6 12-6-30z" fill="#14b8a6" opacity=".85"/></g><text x="270" y="160" text-anchor="middle" class="txt" font-family="ui-sans-serif,system-ui" font-size="11">Certified</text></svg>