<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" fill="none" role="img"><title>Webcam proctoring with face check</title><defs><linearGradient id="mint" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#5b84ff"/></linearGradient><linearGradient id="spec" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d4ed8"/><stop offset=".5" stop-color="#2f5be7"/><stop offset="1" stop-color="#38bdf8"/></linearGradient></defs><style>
  .surf{fill:#f8fafc;stroke:#64748b;stroke-opacity:.7}
  .ln{stroke:#64748b;stroke-opacity:.6;fill:none}
  .txt{fill:#64748b;opacity:.75}
  @media (prefers-reduced-motion: reduce){
    *{animation:none!important}
    .tag,.num,.row,.ev,.pass,.f{opacity:1!important}
    .ck,.ok{stroke-dashoffset:0!important}
    .gauge{stroke-dashoffset:36!important}
    .pkt{offset-distance:50%}
  }

  .scan{animation:scan 2.6s ease-in-out infinite alternate}
  @keyframes scan{from{transform:translateY(0)}to{transform:translateY(58px)}}
  .rec{animation:blink 1.4s steps(2,start) infinite}
  @keyframes blink{to{visibility:hidden}}
  .ok{stroke:#2f5be7;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:30;stroke-dashoffset:30;animation:tick 2.6s ease-out infinite}
  @keyframes tick{0%,55%{stroke-dashoffset:30}75%,100%{stroke-dashoffset:0}}
</style><rect x="22" y="14" width="116" height="80" rx="8" class="surf" stroke-width="1.5"/><path d="M40 22h-10v10M120 22h10v10M40 86h-10v-10M120 86h10v-10" stroke="#2f5be7" stroke-width="2.5" stroke-linecap="round"/><circle cx="80" cy="46" r="13" class="ln" stroke-width="2"/><path d="M58 84c3-13 12-19 22-19s19 6 22 19" class="ln" stroke-width="2"/><clipPath id="pv"><rect x="22" y="14" width="116" height="80" rx="8"/></clipPath><g clip-path="url(#pv)"><rect class="scan" x="22" y="20" width="116" height="3" fill="#2f5be7" opacity=".7"/></g><circle class="rec" cx="34" cy="104" r="4" fill="#ef4444"/><text x="44" y="108" class="txt" font-family="ui-sans-serif,system-ui" font-size="10">Proctoring</text><path class="ok" d="M110 104l6 6 12-12"/></svg>