<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none" role="img"><title>Code editor running test cases</title><defs><linearGradient id="mint" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#5b84ff"/></linearGradient><linearGradient id="spec" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d4ed8"/><stop offset=".5" stop-color="#2f5be7"/><stop offset="1" stop-color="#38bdf8"/></linearGradient></defs><style>
  .surf{fill:#0d131f;stroke:#94a3b8;stroke-opacity:.7}
  .ln{stroke:#94a3b8;stroke-opacity:.6;fill:none}
  .txt{fill:#94a3b8;opacity:.75}
  @media (prefers-reduced-motion: reduce){
    *{animation:none!important}
    .tag,.num,.row,.ev,.pass,.f{opacity:1!important}
    .ck,.ok{stroke-dashoffset:0!important}
    .gauge{stroke-dashoffset:36!important}
    .pkt{offset-distance:50%}
  }

  .caret{animation:blink 1s steps(2,start) infinite}@keyframes blink{to{visibility:hidden}}
  .l{transform-box:fill-box;transform-origin:0 50%;animation:type 4s steps(10) infinite}
  .l2{animation-delay:.5s}.l3{animation-delay:1s}
  @keyframes type{0%{transform:scaleX(0)}40%,90%{transform:scaleX(1)}100%{transform:scaleX(0)}}
  .pass{fill:#2f5be7;opacity:0;animation:pass 4s ease infinite}@keyframes pass{0%,55%{opacity:0}65%,90%{opacity:1}100%{opacity:0}}
</style><rect x="8" y="12" width="80" height="62" rx="7" class="surf" stroke-width="1.5"/><circle cx="18" cy="21" r="2.5" fill="#ef4444" opacity=".7"/><circle cx="26" cy="21" r="2.5" fill="#f59e0b" opacity=".7"/><circle cx="34" cy="21" r="2.5" fill="#2f5be7" opacity=".7"/><rect class="l" x="16" y="33" width="44" height="5" rx="2.5" fill="#0ea5e9" opacity=".8"/><rect class="l l2" x="24" y="44" width="38" height="5" rx="2.5" fill="#3b82f6" opacity=".8"/><rect class="l l3" x="24" y="55" width="26" height="5" rx="2.5" fill="#475569"/><rect class="caret" x="53" y="54" width="2" height="7" fill="#2f5be7"/><g class="pass"><rect x="46" y="68" width="42" height="18" rx="9"/><text x="67" y="80.5" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" font-weight="700" fill="#fff">8/8 ✓</text></g></svg>