<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" fill="none" role="img"><title>Candidates sorted into a ranked shortlist</title><defs><linearGradient id="mint" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#5b84ff"/></linearGradient><linearGradient id="spec" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d4ed8"/><stop offset=".5" stop-color="#2f5be7"/><stop offset="1" stop-color="#38bdf8"/></linearGradient></defs><style>
  .surf{fill:#0d131f;stroke:#94a3b8;stroke-opacity:.7}
  .ln{stroke:#94a3b8;stroke-opacity:.6;fill:none}
  .txt{fill:#94a3b8;opacity:.75}
  @media (prefers-reduced-motion: reduce){
    *{animation:none!important}
    .tag,.num,.row,.ev,.pass,.f{opacity:1!important}
    .ck,.ok{stroke-dashoffset:0!important}
    .gauge{stroke-dashoffset:36!important}
    .pkt{offset-distance:50%}
  }

  .b{transform-box:fill-box;transform-origin:0 50%;animation:len 5s cubic-bezier(.3,.7,.2,1) infinite}
  .b1{--a:.45}.b2{--a:1}.b3{--a:.7}.b4{--a:.85}
  @keyframes len{0%,10%{transform:scaleX(var(--a))}40%,85%{transform:scaleX(1)}100%{transform:scaleX(var(--a))}}
  .tag{opacity:0;animation:fade 5s ease infinite}
  @keyframes fade{0%,40%{opacity:0}55%,85%{opacity:1}100%{opacity:0}}
</style><text x="18" y="30" class="txt" font-family="ui-monospace,monospace" font-size="10">1</text><rect class="b b1" x="32" y="20" width="96" height="14" rx="4" fill="url(#mint)" opacity="1"/><text x="18" y="54" class="txt" font-family="ui-monospace,monospace" font-size="10">2</text><rect class="b b2" x="32" y="44" width="84" height="14" rx="4" fill="url(#mint)" opacity="1"/><text x="18" y="78" class="txt" font-family="ui-monospace,monospace" font-size="10">3</text><rect class="b b3" x="32" y="68" width="72" height="14" rx="4" fill="url(#mint)" opacity="1"/><text x="18" y="102" class="txt" font-family="ui-monospace,monospace" font-size="10">4</text><rect class="b b4" x="32" y="92" width="60" height="14" rx="4" fill="#475569" opacity="0.45"/><line x1="30" y1="88" x2="140" y2="88" stroke="#2f5be7" stroke-width="1.5" stroke-dasharray="4 4"/><g class="tag"><rect x="98" y="96" width="46" height="16" rx="8" fill="#2f5be7"/><text x="121" y="107.5" text-anchor="middle" font-family="ui-sans-serif,system-ui" font-size="9" font-weight="700" fill="#fff">CSV</text></g></svg>