<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 210" fill="none" role="img"><title>A timed coding assessment passing its test cases</title><defs><linearGradient id="mint" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#5b84ff"/></linearGradient><linearGradient id="spec" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d4ed8"/><stop offset=".5" stop-color="#2f5be7"/><stop offset="1" stop-color="#38bdf8"/></linearGradient></defs><style>
  .surf{fill:#f8fafc;stroke:#64748b;stroke-opacity:.7}
  .ln{stroke:#64748b;stroke-opacity:.6;fill:none}
  .txt{fill:#64748b;opacity:.75}
  @media (prefers-reduced-motion: reduce){
    *{animation:none!important}
    .tag,.num,.row,.ev,.pass,.f{opacity:1!important}
    .ck,.ok{stroke-dashoffset:0!important}
    .gauge{stroke-dashoffset:36!important}
    .pkt{offset-distance:50%}
  }

  .l{transform-box:fill-box;transform-origin:0 50%;animation:type 6s steps(14) infinite}
  .l2{animation-delay:.6s}.l3{animation-delay:1.2s}.l4{animation-delay:1.8s}
  @keyframes type{0%{transform:scaleX(0)}35%,90%{transform:scaleX(1)}100%{transform:scaleX(0)}}
  .gauge{stroke-dasharray:226;stroke-dashoffset:226;animation:g 6s cubic-bezier(.2,.7,.2,1) infinite}
  @keyframes g{0%,40%{stroke-dashoffset:226}65%,90%{stroke-dashoffset:36}100%{stroke-dashoffset:226}}
  .num{opacity:0;animation:n 6s ease infinite}@keyframes n{0%,58%{opacity:0}68%,90%{opacity:1}100%{opacity:0}}
  .timer{transform-origin:290px 52px;animation:spin 6s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
</style><rect x="10" y="20" width="230" height="170" rx="10" class="surf" stroke-width="1.5"/><rect x="10" y="20" width="230" height="26" rx="10" fill="#94a3b8" fill-opacity=".10"/><circle cx="26" cy="33" r="3.5" fill="#ef4444" opacity=".7"/><circle cx="38" cy="33" r="3.5" fill="#f59e0b" opacity=".7"/><circle cx="50" cy="33" r="3.5" fill="#2f5be7" opacity=".7"/><text x="70" y="37" class="txt" font-family="ui-monospace,monospace" font-size="10">assessment.java</text><rect class="l" x="28" y="64" width="120" height="7" rx="3.5" fill="#0ea5e9" opacity=".85"/><rect class="l l2" x="44" y="84" width="150" height="7" rx="3.5" fill="#3b82f6" opacity=".85"/><rect class="l l3" x="44" y="104" width="96" height="7" rx="3.5" fill="#94a3b8"/><rect class="l l4" x="28" y="124" width="60" height="7" rx="3.5" fill="#5b84ff" opacity=".85"/><rect x="28" y="150" width="194" height="24" rx="6" fill="#94a3b8" fill-opacity=".1"/><text x="40" y="166" font-family="ui-monospace,monospace" font-size="10" fill="#2f5be7">✓ 12 / 12 test cases passed</text><circle cx="290" cy="52" r="22" class="surf" stroke-width="1.5"/><line class="timer" x1="290" y1="52" x2="290" y2="36" stroke="#2f5be7" stroke-width="2.5" stroke-linecap="round"/><text x="290" y="92" text-anchor="middle" class="txt" font-family="ui-monospace,monospace" font-size="10">42:10 left</text><circle cx="290" cy="150" r="36" stroke="#94a3b8" stroke-opacity=".2" stroke-width="8"/><circle class="gauge" cx="290" cy="150" r="36" stroke="url(#spec)" stroke-width="8" stroke-linecap="round" transform="rotate(-90 290 150)"/><text class="num" x="290" y="156" text-anchor="middle" font-family="ui-monospace,monospace" font-size="17" font-weight="700" fill="#2f5be7">94</text></svg>