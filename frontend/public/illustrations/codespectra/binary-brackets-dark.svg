<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" fill="none" role="img"><title>Code brackets filled with streaming binary digits</title><defs><linearGradient id="mint" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#5b84ff"/></linearGradient><linearGradient id="bb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#60a5fa"/><stop offset=".55" stop-color="#2f5be7"/><stop offset="1" stop-color="#1e40af"/></linearGradient><mask id="brk" maskUnits="userSpaceOnUse" x="0" y="0" width="360" height="240"><g stroke="#fff" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M120 50 L50 120 L120 190"/><path d="M240 50 L310 120 L240 190"/><path d="M200 30 L160 210"/></g></mask></defs><style>
