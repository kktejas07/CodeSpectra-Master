<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" fill="none" role="img"><title>Questions stacked by difficulty, worth 3, 4 and 5 points</title><defs><linearGradient id="mint" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#14b8a6"/><stop offset="1" stop-color="#3ecf8e"/></linearGradient><linearGradient id="spec" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset=".5" stop-color="#00c573"/><stop offset="1" stop-color="#38bdf8"/></linearGradient></defs><style>
  .surf{fill:#0d131f;stroke:#94a3b8;stroke-opacity:.7}
  .ln{stroke:#94a3b8;stroke-opacity:.6;fill:none}
  .txt{fill:#94a3b8;opacity:.75}
  @media (prefers-reduced-motion: reduce){
    *{animation:none!important}
    .tag,.num,.row,.ev,.pass,.f{opacity:1!important}
    .ck,.ok{stroke-dashoffset:0!important}
    .gauge{stroke-dashoffset:36!important}
    .pkt{offset-distance:50%}
  }

  .card{animation:stack 4s ease-in-out infinite}
  .c2{animation-delay:.25s}.c3{animation-delay:.5s}
  @keyframes stack{0%,10%{transform:translateY(-14px);opacity:0}30%,85%{transform:none;opacity:1}100%{transform:translateY(-14px);opacity:0}}
</style><g class="card c1"><rect x="24" y="18" width="112" height="24" rx="5" class="surf"/><rect x="32" y="27" width="44" height="6" rx="3" fill="#94a3b8" opacity=".45"/><rect x="100" y="23" width="28" height="14" rx="7" fill="#3ecf8e" opacity=".9"/><text x="114" y="33.5" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" font-weight="700" fill="#020617">3</text></g><g class="card c2"><rect x="24" y="48" width="112" height="24" rx="5" class="surf"/><rect x="32" y="57" width="44" height="6" rx="3" fill="#94a3b8" opacity=".45"/><rect x="100" y="53" width="28" height="14" rx="7" fill="#14b8a6" opacity=".9"/><text x="114" y="63.5" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" font-weight="700" fill="#020617">4</text></g><g class="card c3"><rect x="24" y="78" width="112" height="24" rx="5" class="surf"/><rect x="32" y="87" width="44" height="6" rx="3" fill="#94a3b8" opacity=".45"/><rect x="100" y="83" width="28" height="14" rx="7" fill="#06b6d4" opacity=".9"/><text x="114" y="93.5" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" font-weight="700" fill="#020617">5</text></g></svg>