# Gitleaks config — extend the default rules, allowlist only provably-fake
# test fixtures. Everything else that looks like a secret fails CI (see the
# `secrets` job in .github/workflows/ci.yml).
#
# Uses the single [allowlist] table: gitleaks-action pins gitleaks 8.24.x,
# which ignores the newer [[allowlists]] array form (newer gitleaks accepts both).
[extend]
useDefault = true

[allowlist]
description = "Documented-fake keys in scanner/test fixtures, and one commit that held throwaway CI smoke-test keys (since replaced by per-run random keys)"
paths = [
  '''frontend/components/scanner/secret-scanner-panel.tsx''',
  '''frontend/tests/secret-scanner.test.ts''',
  '''frontend/tests/llm-legacy-key.test.ts''',
]
commits = ["de4ddf656aea2bf23b7d97b2770d4e49f4bb04ae"]
