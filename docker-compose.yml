services:
  piston:
    # ponytail: intentionally :latest — ghcr.io/engineer-man/piston publishes no
    # verifiable versioned tags (only `latest` on the package page as of 2026-09-06).
    image: ghcr.io/engineer-man/piston:latest
    container_name: codespectra-piston
    cap_add:
      - SYS_ADMIN
      - SYS_PTRACE
    # SECURITY: Piston runs arbitrary code with no auth. It is reachable ONLY on
    # the compose network (http://piston:2000) — never publish its port.
    expose:
      - "2000"
    volumes:
      - piston-data:/piston
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2000/api/v2/runtimes"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://codespectra.ai}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID}
    container_name: codespectra-frontend
    ports:
      - "3000:80"
    # Runtime-only secrets (never build args — they would be baked into the image).
    environment:
      - PISTON_URL=http://piston:2000/api/v2
      - DIDIT_API_KEY=${DIDIT_API_KEY:-}
      - DIDIT_WEBHOOK_SECRET=${DIDIT_WEBHOOK_SECRET:-}
      - SECRETS_ENCRYPTION_KEY=${SECRETS_ENCRYPTION_KEY:-}
      - ATS_ENCRYPTION_KEY=${ATS_ENCRYPTION_KEY:-}
      - IDENTITY_MEDIA_KEY=${IDENTITY_MEDIA_KEY:-}
      - CRON_SECRET=${CRON_SECRET:-}
    depends_on:
      piston:
        condition: service_healthy
    # ponytail: node:22-alpine has no curl — busybox wget is the probe.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:80/api/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # Same image as frontend, no HTTP. Polls generation_jobs. 1 replica only.
  course-worker:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://codespectra.ai}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID}
    container_name: codespectra-course-worker
    environment:
      - COURSE_WORKER=1
      - MONGODB_URI=${MONGODB_URI}
      - MONGODB_DB_NAME=${MONGODB_DB_NAME:-codespectra}
      - INTERNAL_BACKEND_URL=http://backend:8000
      - INTERNAL_BACKEND_SECRET=${INTERNAL_BACKEND_SECRET}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    # ponytail: 1 replica. A second replica can race-claim; scale only after a Redis lock.

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codespectra-backend
    ports:
      - "8001:8000"
    environment:
      - NEXTJS_INTERNAL_URL=http://frontend:80
    env_file:
      - ./backend/.env
    depends_on:
      frontend:
        condition: service_healthy
    # ponytail: python:3.12-slim ships neither curl nor wget — stdlib urllib is the probe.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/__proxy_health', timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  livekit:
    # ponytail: pinned to v1.13.6 (verified current on Docker Hub 2026-09-06).
    # LOCAL DEVELOPMENT ONLY: --dev uses the well-known devkey/secret, so this
    # service sits behind the "dev" profile (`docker compose --profile dev up`)
    # and binds to 127.0.0.1 only. Production: LiveKit Cloud or a LiveKit server
    # with your own keys + TLS + TURN; put its wss:// URL and keys in
    # Admin → Settings → Hiring integrations (livekit_url / _api_key / _api_secret).
    # No healthcheck: the image has no shell and no plain-HTTP health endpoint.
    image: livekit/livekit-server:v1.13.6
    container_name: codespectra-livekit
    profiles: ["dev"]
    command: --dev --bind 0.0.0.0
    ports:
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:50000-50010:50000-50010/udp"
    restart: unless-stopped

volumes:
  piston-data:
