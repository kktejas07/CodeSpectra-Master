<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CodeSpectra — offline</title>
<!--
  Shown by Capacitor (server.errorPath) when the live site can't be loaded,
  e.g. the first launch with no connection. Once the site has loaded once,
  its service worker serves the PWA offline pages instead.
  Plain inline file: no network, no external fonts, en / hi / te by device language.
-->
<style>
  :root { color-scheme: light dark; --bg: #f7f9fc; --card: #ffffff; --fg: #0b1220; --muted: #4b5563; --border: #e2e8f0; --primary: #00a866; --on-primary: #ffffff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #080D17; --card: #0f1726; --fg: #e6edf7; --muted: #9aa7b8; --border: #1f2a3c; --primary: #00D681; --on-primary: #04130c; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { width: 100%; max-width: 360px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 28px 20px; text-align: center; }
  svg { width: 48px; height: 48px; color: var(--muted); }
  h1 { font-size: 20px; margin: 16px 0 8px; }
  p { color: var(--muted); margin: 0 0 24px; }
  button { width: 100%; min-height: 48px; border: 0; border-radius: 10px; background: var(--primary); color: var(--on-primary); font: inherit; font-weight: 600; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
  #status { min-height: 1.5em; margin-top: 12px; font-size: 14px; }
</style>
</head>
<body>
<main role="alert" aria-live="polite">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M2 8.8a15 15 0 0 1 20 0"/><path d="M5 12.6a10 10 0 0 1 9.5-2.5"/><path d="M8.5 16.4a5 5 0 0 1 4-1.3"/><path d="M12 20h.01"/><path d="m16 14 6 6"/><path d="m22 14-6 6"/>
  </svg>
  <h1 id="title">You're offline</h1>
  <p id="body">CodeSpectra needs a connection to load. Check your Wi-Fi or mobile data, then try again.</p>
  <button id="retry" type="button">Try again</button>
  <div id="status"></div>
</main>
<script>
  (function () {
    var T = {
      en: { title: "You're offline", body: "CodeSpectra needs a connection to load. Check your Wi-Fi or mobile data, then try again.", retry: "Try again", wait: "Still offline. We'll retry when you're back online." },
      hi: { title: "आप ऑफ़लाइन हैं", body: "CodeSpectra खोलने के लिए इंटरनेट चाहिए। अपना वाई-फ़ाई या मोबाइल डेटा देखें, फिर दोबारा कोशिश करें।", retry: "फिर कोशिश करें", wait: "अभी भी ऑफ़लाइन हैं। इंटरनेट लौटते ही हम फिर कोशिश करेंगे।" },
      te: { title: "మీరు ఆఫ్‌లైన్‌లో ఉన్నారు", body: "CodeSpectra తెరవడానికి ఇంటర్నెట్ కావాలి. మీ Wi-Fi లేదా మొబైల్ డేటాను చూసి, మళ్లీ ప్రయత్నించండి.", retry: "మళ్లీ ప్రయత్నించండి", wait: "ఇంకా ఆఫ్‌లైన్‌లోనే ఉన్నారు. కనెక్షన్ రాగానే మళ్లీ ప్రయత్నిస్తాం." }
    };
    var lang = String(navigator.language || "en").slice(0, 2);
    var t = T[lang] || T.en;
    document.documentElement.lang = T[lang] ? lang : "en";
    document.getElementById("title").textContent = t.title;
    document.getElementById("body").textContent = t.body;
    var btn = document.getElementById("retry");
    btn.textContent = t.retry;
    // scripts/flavor-configs.mjs writes this build flavour's site URL here.
    var START = "__CS_SERVER_URL__";
    function startUrl() {
      if (START.indexOf("__") !== 0) return START;
      try { var c = window.Capacitor && window.Capacitor.getServerUrl && window.Capacitor.getServerUrl(); if (c) return c; } catch (e) {}
      return "/";
    }
    function retry() {
      if (navigator.onLine === false) { document.getElementById("status").textContent = t.wait; return; }
      window.location.replace(startUrl());
    }
    btn.addEventListener("click", retry);
    window.addEventListener("online", retry);
  })();
</script>
</body>
</html>
