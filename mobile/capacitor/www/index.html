<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CodeSpectra</title>
<!-- Only shown if server.url is missing from the build's capacitor config.
     Every real build loads the live site (see capacitor.config.json / flavours). -->
<style>
  :root { color-scheme: light dark; --bg: #ffffff; --fg: #0b1220; --muted: #4b5563; }
  @media (prefers-color-scheme: dark) { :root { --bg: #080D17; --fg: #e6edf7; --muted: #9aa7b8; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
  p { color: var(--muted); margin: 0 16px; text-align: center; }
</style>
</head>
<body><p>CodeSpectra</p></body>
</html>
